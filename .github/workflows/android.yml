name: Build Android APK from Web App

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 1. Initialize npm silently
      - name: Initialize npm package
        working-directory: ./frontend
        run: |
          echo '{"name": "srs-traders", "version": "1.0.0", "private": true}' > package.json

      # 2. Pre-create the Capacitor config file to completely skip the interactive init prompt
      - name: Create Capacitor Configuration File
        working-directory: ./frontend
        run: |
          echo '{"appId": "com.srstraders.app", "appName": "SRS Traders", "webDir": "."}' > capacitor.config.json

      # 3. Install Capacitor modules
      - name: Install Capacitor Core & CLI
        working-directory: ./frontend
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save-dev

      # 4. Inject the native Android project structures
      - name: Add Android Platform
        working-directory: ./frontend
        run: npx cap add android

      # 5. Sync your HTML/CSS/JS files directly into the Android build layers
      - name: Sync Web Assets to Android
        working-directory: ./frontend
        run: npx cap sync android

      # 6. Execute Gradle to assemble the final debug APK
      - name: Build Android APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug

      # 7. Expose the built file for free download in GitHub Actions UI
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: srs-traders-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
